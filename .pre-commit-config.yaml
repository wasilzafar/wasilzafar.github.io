# Pre-commit hooks for wasilzafar.com
# Install: uv tool install pre-commit && pre-commit install
# Skip:    git commit --no-verify
# Run all: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: check-encoding
        name: Check UTF-8 encoding (mojibake, BOM)
        entry: python .github/scripts/check-encoding.py
        language: system
        files: \.html$
        pass_filenames: false

      - id: check-links
        name: Check internal page links
        entry: python .github/scripts/seo/check_links.py --pages-only
        language: system
        files: \.html$
        pass_filenames: false

      - id: check-canonicals
        name: Check <link rel="canonical"> tags
        entry: python .github/scripts/seo/check_canonicals.py
        language: system
        files: \.html$
        pass_filenames: false

      # ── Generated artifacts: rebuild & auto-stage on any HTML change ──
      # Mirrors the CI freshness checks in .github/workflows/validate.yml.
      # Split into build + stage steps (no shell operators) so it works
      # identically from git-commit, `pre-commit run`, or CI.
      - id: rebuild-search-index
        name: Rebuild search-index.json
        entry: node .github/scripts/search/build-search-index.js
        language: system
        files: \.html$
        pass_filenames: false

      - id: stage-search-index
        name: Stage rebuilt search-index.json
        entry: git add search-index.json
        language: system
        files: \.html$
        pass_filenames: false

      - id: rebuild-feeds
        name: Rebuild RSS/Atom feeds
        entry: node .github/scripts/feeds/build-feeds.js --deterministic
        language: system
        files: \.html$
        pass_filenames: false

      - id: stage-feeds
        name: Stage rebuilt RSS/Atom feeds
        entry: git add feed.xml atom.xml feeds
        language: system
        files: \.html$
        pass_filenames: false
